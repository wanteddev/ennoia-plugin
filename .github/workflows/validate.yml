name: Validate plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check generated manifests
        run: python scripts/sync_manifests.py --check
      - name: Validate packaged paths, skills and MCP contracts
        run: python scripts/validate.py
      - name: Local file uploader regression tests
        run: node --test tests/test_file_uploader*.mjs
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Publish version tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release.py
