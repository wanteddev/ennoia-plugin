<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ennoia Plugin 브랜드 미리보기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 44px; background: #f4f4f5; color: #14181d; font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 1000px; margin: auto; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 28px; color: #62666c; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  section { padding: 28px; border-radius: 20px; background: #fff; border: 1px solid #e1e2e4; }
  section.dark { color: #f7f7f8; background: #171719; border-color: #292a2d; }
  h2 { margin: 0 0 20px; font-size: 14px; font-weight: 500; }
  .wordmark { display: block; width: 260px; max-width: 100%; height: auto; margin: 0 0 24px; }
  .sizes { display: flex; align-items: center; gap: 28px; min-height: 72px; margin-bottom: 24px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  figcaption { font-size: 11px; opacity: .65; margin-top: 6px; }
  .chip { display: flex; align-items: center; gap: 10px; border: 1px solid #e1e2e4; border-radius: 10px; padding: 10px 14px; }
  .dark .chip { border-color: #46474c; }
  .chip img { width: 24px; height: 24px; }
  .swatch { display: inline-block; width: 24px; height: 24px; vertical-align: middle; border-radius: 6px; background: #0066ff; margin-right: 10px; }
  footer { margin-top: 24px; font-size: 13px; color: #62666c; }
  @media (max-width: 720px) { body { padding: 24px; } .themes { grid-template-columns: 1fr; } }
</style>
<main>
  <h1>Ennoia Plugin</h1>
  <p>공식 서비스 자산과 브랜드 색상 · 1.0.2 미리보기</p>
  <div class="themes">
    <section>
      <h2>밝은 배경</h2>
      <img class="wordmark" src="../plugins/ennoia/assets/logo.svg" alt="Ennoia 기본 로고">
      <div class="sizes">
        <figure><img src="../plugins/ennoia/assets/icon.png" width="16" height="16" alt=""><figcaption>16px</figcaption></figure>
        <figure><img src="../plugins/ennoia/assets/icon.png" width="24" height="24" alt=""><figcaption>24px</figcaption></figure>
        <figure><img src="../plugins/ennoia/assets/icon.png" width="48" height="48" alt=""><figcaption>48px</figcaption></figure>
      </div>
      <div class="chip"><img src="../plugins/ennoia/skills/ennoia-connect/assets/icon.png" alt="Ennoia 아이콘">Ennoia 연결</div>
    </section>
    <section class="dark">
      <h2>어두운 배경</h2>
      <img class="wordmark" src="../plugins/ennoia/assets/logo-dark.svg" alt="Ennoia 다크 모드 로고">
      <div class="sizes">
        <figure><img src="../plugins/ennoia/assets/icon.png" width="16" height="16" alt=""><figcaption>16px</figcaption></figure>
        <figure><img src="../plugins/ennoia/assets/icon.png" width="24" height="24" alt=""><figcaption>24px</figcaption></figure>
        <figure><img src="../plugins/ennoia/assets/icon.png" width="48" height="48" alt=""><figcaption>48px</figcaption></figure>
      </div>
      <div class="chip"><img src="../plugins/ennoia/skills/ennoia-connect/assets/icon.png" alt="Ennoia 아이콘">Ennoia 연결</div>
    </section>
  </div>
  <footer><span class="swatch"></span>브랜드 강조색 #0066FF · 로고 원색 #14181D<br>패키지 asset 확인용 페이지입니다. 실제 Codex App 화면이 아닙니다.</footer>
</main>
</html>
